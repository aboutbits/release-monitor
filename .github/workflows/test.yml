name: Lint and Test

on:
  workflow_call:

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: release_monitor_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d release_monitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - name: Configure GitHub Packages registry
        run: |
          echo "@aboutbits:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
        env:
          TEST_DATABASE_URL: postgres://root:password@localhost:5432/release_monitor_test
